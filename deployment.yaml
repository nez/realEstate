---
apiVersion: v1
kind: Namespace
metadata:
  name: realestate

---
# Create the Secret before applying this manifest:
#   kubectl create secret generic mongodb-creds -n realestate \
#     --from-literal=MONGO_INITDB_ROOT_USERNAME=admin \
#     --from-literal=MONGO_INITDB_ROOT_PASSWORD='<rotated-password>' \
#     --from-literal=MONGO_INITDB_DATABASE=suumo \
#     --from-literal=MONGO_URI='mongodb://admin:<rotated-password>@mongodb.realestate.svc.cluster.local:27017/?authSource=admin'
# See secret.example.yaml for the shape.
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: mongodb
  name: mongodb
  namespace: realestate
spec:
  ports:
    - name: "27017"
      port: 27017
      targetPort: 27017
  selector:
    io.kompose.service: mongodb

---
# Persistent storage for mongo data. Without this every pod restart wipes
# the database — the old Deployment was effectively emptyDir.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: realestate
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-backup
  namespace: realestate
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mongodb
  name: mongodb
  namespace: realestate
spec:
  replicas: 1
  strategy:
    # ReadWriteOnce PVCs can't be attached to two pods; rolling updates would
    # deadlock. Recreate kills the old pod before starting the new one.
    type: Recreate
  selector:
    matchLabels:
      io.kompose.service: mongodb
  template:
    metadata:
      labels:
        io.kompose.network/realestate-default: "true"
        io.kompose.service: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          envFrom:
            - secretRef:
                name: mongodb-creds
          env:
            - name: TZ
              value: Asia/Tokyo
          ports:
            - containerPort: 27017
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb-data
      restartPolicy: Always

---
# Daily mongodump → /backup PVC. Keeps the last 14 days of archives.
# The same root MONGO_URI from mongodb-creds is reused.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
  namespace: realestate
spec:
  schedule: "0 4 * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mongodump
              image: mongo:7.0
              env:
                - name: TZ
                  value: Asia/Tokyo
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: mongodb-creds
                      key: MONGO_URI
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  TS=$(date +%Y%m%d-%H%M%S)
                  ARCHIVE=/backup/suumo-$TS.archive.gz
                  echo "Dumping to $ARCHIVE"
                  mongodump --uri="$MONGO_URI" --gzip --archive="$ARCHIVE"
                  echo "Pruning archives older than 14 days..."
                  find /backup -maxdepth 1 -name 'suumo-*.archive.gz' -mtime +14 -delete
                  echo "Backup directory state:"
                  ls -lh /backup/ | tail -20
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: mongodb-backup

---
# Listing crawler: discovers properties from index pages. Runs nightly.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scraper-listing
  namespace: realestate
spec:
  schedule: "0 23 * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: suumo-scraper
              image: suumo-scraper
              imagePullPolicy: IfNotPresent
              env:
                - name: TZ
                  value: Asia/Tokyo
                - name: MAX_REQ_PER_MINUTE
                  value: "30"
                - name: SCRAPE_MODE
                  value: LISTING
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: mongodb-creds
                      key: MONGO_URI

---
# Detail crawler: fills in details for unscraped listings. Runs frequently.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scraper-detail
  namespace: realestate
spec:
  schedule: "*/5 * * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: suumo-scraper
              image: suumo-scraper
              imagePullPolicy: IfNotPresent
              env:
                - name: TZ
                  value: Asia/Tokyo
                - name: MAX_REQ_PER_MINUTE
                  value: "30"
                - name: SCRAPE_MODE
                  value: DETAIL
                - name: STORE_HTML
                  value: "true"
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: mongodb-creds
                      key: MONGO_URI
