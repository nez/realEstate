---
apiVersion: v1
kind: Namespace
metadata:
  name: realestate

---
# Create the Secret before applying this manifest:
#   kubectl create secret generic mongodb-creds -n realestate \
#     --from-literal=MONGO_INITDB_ROOT_USERNAME=admin \
#     --from-literal=MONGO_INITDB_ROOT_PASSWORD='<rotated-password>' \
#     --from-literal=MONGO_INITDB_DATABASE=suumo \
#     --from-literal=MONGO_URI='mongodb://admin:<rotated-password>@mongodb.realestate.svc.cluster.local:27017/?authSource=admin'
# See secret.example.yaml for the shape.
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: mongodb
  name: mongodb
  namespace: realestate
spec:
  ports:
    - name: "27017"
      port: 27017
      targetPort: 27017
  selector:
    io.kompose.service: mongodb

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mongodb
  name: mongodb
  namespace: realestate
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mongodb
  template:
    metadata:
      labels:
        io.kompose.network/realestate-default: "true"
        io.kompose.service: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:latest
          envFrom:
            - secretRef:
                name: mongodb-creds
          env:
            - name: TZ
              value: Asia/Tokyo
          ports:
            - containerPort: 27017
              protocol: TCP
      restartPolicy: Always

---
# Listing crawler: discovers properties from index pages. Runs nightly.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scraper-listing
  namespace: realestate
spec:
  schedule: "0 23 * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: suumo-scraper
              image: suumo-scraper
              imagePullPolicy: IfNotPresent
              env:
                - name: TZ
                  value: Asia/Tokyo
                - name: SCRAPE_MODE
                  value: LISTING
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: mongodb-creds
                      key: MONGO_URI

---
# Detail crawler: fills in details for unscraped listings. Runs frequently.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scraper-detail
  namespace: realestate
spec:
  schedule: "*/5 * * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: suumo-scraper
              image: suumo-scraper
              imagePullPolicy: IfNotPresent
              env:
                - name: TZ
                  value: Asia/Tokyo
                - name: SCRAPE_MODE
                  value: DETAIL
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: mongodb-creds
                      key: MONGO_URI
