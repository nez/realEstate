# Copy to secret.yaml, fill in real values, apply once.
# secret.yaml is gitignored. Prefer `kubectl create secret` over committing this file.
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-creds
  namespace: realestate
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: CHANGE_ME
  MONGO_INITDB_DATABASE: suumo
  MONGO_URI: mongodb://admin:CHANGE_ME@mongodb.realestate.svc.cluster.local:27017/?authSource=admin
