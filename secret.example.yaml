# Copy to secret.yaml, fill in real values, apply once.
# secret.yaml is gitignored. Prefer `kubectl create secret` over committing this file.
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-creds
  namespace: realestate
type: Opaque
stringData:
  # Root admin — used by the mongo image's bootstrap and by mongodump.
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: CHANGE_ME_ROOT
  MONGO_INITDB_DATABASE: suumo

  # App user — readWrite on the suumo DB only. Created automatically by the
  # init script on first boot; recreate manually via mongosh for existing
  # data (see README).
  MONGO_APP_USERNAME: suumo_app
  MONGO_APP_PASSWORD: CHANGE_ME_APP

  # Root URI — used by the backup CronJob.
  MONGO_URI_ROOT: mongodb://admin:CHANGE_ME_ROOT@mongodb.realestate.svc.cluster.local:27017/?authSource=admin
  # App URI — used by the scraper CronJobs and the local CLI.
  MONGO_URI_APP: mongodb://suumo_app:CHANGE_ME_APP@mongodb.realestate.svc.cluster.local:27017/?authSource=suumo
