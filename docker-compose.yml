services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-suumo}
      TZ: Asia/Tokyo
    ports:
      - 27017:27017
    volumes:
      - mongodb-data:/data/db

  scraper:
    build:
      context: ./scraper
      dockerfile: ./docker/Dockerfile
    image: suumo-scraper
    container_name: suumo-scraper
    restart: "no"
    environment:
      TZ: Asia/Tokyo
      MONGO_URI: ${MONGO_URI:?set MONGO_URI in .env}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-suumo}
      MONGO_COLLECTION_NAME: ${MONGO_COLLECTION_NAME:-listings}
      MONGO_COLLECTION_DETAILS: ${MONGO_COLLECTION_DETAILS:-details}
      MONGO_COLLECTION_STATE: ${MONGO_COLLECTION_STATE:-scraper_state}
      SCRAPE_MODE: ${SCRAPE_MODE:-LISTING}
      STORE_HTML: ${STORE_HTML:-true}
    depends_on:
      - mongodb

volumes:
  mongodb-data:
